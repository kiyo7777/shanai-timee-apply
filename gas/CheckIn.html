<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>チェックイン</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#1a73e8;}
.card{background:rgba(255,255,255,.15);backdrop-filter:blur(10px);border-radius:20px;padding:40px 32px;max-width:380px;width:90%;text-align:center;}
#icon{font-size:64px;margin-bottom:16px;}
h1{font-size:24px;font-weight:700;margin-bottom:8px;}
.sub{font-size:15px;opacity:.85;margin-bottom:24px;}
.time{font-size:40px;font-weight:700;margin-bottom:8px;}
.detail{font-size:14px;opacity:.8;line-height:1.8;}
.btn{display:block;width:100%;padding:14px;background:rgba(255,255,255,.25);color:#fff;border:2px solid rgba(255,255,255,.5);border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:24px;transition:background .2s;}
.btn:hover{background:rgba(255,255,255,.35);}
body.checkout-mode{background:#34a853;}
body.error-mode{background:#ea4335;}
#loading{font-size:18px;}
</style>
</head>
<body id="body">

<div class="card">
  <div id="loading">
    <div id="icon">&#x23F3;</div>
    <h1>処理中...</h1>
  </div>
  <div id="content" style="display:none;">
    <div id="icon2" style="font-size:64px;margin-bottom:16px;"></div>
    <h1 id="main-msg"></h1>
    <div class="sub" id="sub-msg"></div>
    <div class="time" id="time-display"></div>
    <div class="detail" id="detail-msg"></div>
  </div>
</div>

<script>
var USER_ID = '<?= userId ?>';
var currentTime = new Date();
var timeStr = String(currentTime.getHours()).padStart(2,'0') + ':' + String(currentTime.getMinutes()).padStart(2,'0');

document.getElementById('time-display').textContent = timeStr;

if (!USER_ID) {
  showError('ユーザーIDが見つかりません', 'URLを確認してください');
} else {
  google.script.run
    .withSuccessHandler(function(json) {
      var r = JSON.parse(json);
      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';

      if (r.type === 'checkin') {
        document.getElementById('icon2').textContent = '☀️';
        document.getElementById('main-msg').textContent = 'おはようございます！';
        document.getElementById('sub-msg').textContent = (r.name || '') + 'さん';
        document.getElementById('detail-msg').innerHTML = 'チェックイン完了<br>' + timeStr;
      } else if (r.type === 'checkout') {
        document.getElementById('body').className = 'checkout-mode';
        document.getElementById('icon2').textContent = '🙏';
        document.getElementById('main-msg').textContent = 'おつかれさまでした！';
        document.getElementById('sub-msg').textContent = (r.name || '') + 'さん';
        document.getElementById('detail-msg').innerHTML =
          '実働 <b>' + (r.actual_hours || '-') + ' 時間</b><br>' +
          '手取り: ¥' + Number(r.net_pay || 0).toLocaleString() + '<br>' +
          r.start_time + ' 〜 ' + timeStr;
      } else if (r.type === 'already_done') {
        document.getElementById('icon2').textContent = '✅';
        document.getElementById('main-msg').textContent = '本日の勤務完了';
        document.getElementById('sub-msg').textContent = '';
        document.getElementById('detail-msg').textContent = '本日の勤務記録は完了しています';
      } else {
        showError(r.msg || 'エラーが発生しました', '');
      }
    })
    .withFailureHandler(function(err) {
      showError('エラーが発生しました', err.message);
    })
    .api_processCheckinWeb(USER_ID);
}

function showError(msg, detail) {
  document.getElementById('body').className = 'error-mode';
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
  document.getElementById('icon2').textContent = '❌';
  document.getElementById('main-msg').textContent = msg;
  document.getElementById('sub-msg').textContent = '';
  document.getElementById('detail-msg').textContent = detail;
}
</script>
</body>
</html>
